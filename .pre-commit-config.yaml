# Pre-commit hooks. This file is regenerated by devenv (git-hooks.nix) when
# entering the shell with `devenv shell`. It is committed to the repo so
# non-Nix users and CI can install hooks directly with `pre-commit install`.
# See devenv.nix for the source of truth.
default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: clippy
        name: clippy
        entry: cargo clippy --
        language: system
        pass_filenames: false
        types: [file]
        files: \.rs$
      - id: rustfmt
        name: rustfmt
        entry: cargo fmt --all --
        language: system
        pass_filenames: false
        types: [file]
        files: \.rs$