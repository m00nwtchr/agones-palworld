{{- include "agones-palworld.validate" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agones-palworld.fullname" . }}
  labels:
    {{- include "agones-palworld.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ipFamilyPolicy: {{ .Values.service.ipFamilyPolicy }}
  ipFamilies:
  {{- toYaml .Values.service.ipFamilies | nindent 4 }}
  ports:
    - name: {{ .Values.service.protocol | lower }}
      port: {{ .Values.service.port }}
      protocol: {{ .Values.service.protocol }}
  selector:
    {{- include "agones-palworld.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/controller: palworld
