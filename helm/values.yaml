# values.yaml — agones-palworld chart
#
# Every key is one of:
#   (a) a chart opinion we hold firmly (sensible default for homelab persistent Palworld on Agones)
#   (b) an escape hatch to override an opinion
#   (c) a full pass-through for things we have no claim on (operator-owned maps/lists)

fleet:
  replicas: 1
  strategy: { type: Recreate }
  scheduling: Packed
  template:
    metadata:
      annotations:
        agones.dev/sdk-server: agones-sidecar
    spec:
      # Agones GameServer-specific fields (top-level of spec.template.spec)
      container: palworld
      ports:
        - { name: game, portPolicy: None, containerPort: 8211, protocol: UDP }
      counters:
        players:
          count: 0
      lists:
        players: # players list
          values: []
      health: { periodSeconds: 5, failureThreshold: 5 }
      sdkServer: { grpcPort: 9358, httpPort: 9359 }
      # PodTemplateSpec wraps the standard K8s pod spec (containers, volumes, etc.)
      template:
        metadata:
          labels:
            agones.dev/sdk-server: agones-sidecar
        spec:
          containers:
            - name: palworld
              image: PLACEHOLDER_REPLACED_BY_TEMPLATE
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/scripts/patch-palworld-settings.sh"]
              args: ["-port=8211", "-useperfthreads", "-NoAsyncLoadingThread", "-UseMultithreadForDS"]
              env:
                - name: PALWORLD_RESTAPI_ENABLED
                  value: "True"
              envFrom:
                - secretRef: { name: PLACEHOLDER_REPLACED_BY_TEMPLATE }
              ports:
                - { name: api, containerPort: 8212, protocol: TCP }
              volumeMounts:
                - { name: scripts, mountPath: /scripts }
                - { name: savegames, mountPath: /pal/Package/Pal/Saved }
            - name: agones-sidecar
              image: PLACEHOLDER_REPLACED_BY_TEMPLATE
              imagePullPolicy: IfNotPresent
              env:
                - name: PALWORLD_ADMIN_PASSWORD
                  valueFrom: { secretKeyRef: { name: PLACEHOLDER_REPLACED_BY_TEMPLATE, key: palworld_admin_password } }
                - name: PALWORLD_API_URL
                  value: "http://127.0.0.1:8212/v1/api/"
                - name: POD_NAME
                  valueFrom: { fieldRef: { fieldPath: metadata.name } }
                - name: POD_NAMESPACE
                  valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
              ports:
                - { name: metrics, containerPort: 9090, protocol: TCP }
          volumes:
            - name: scripts
              configMap: { name: PLACEHOLDER_REPLACED_BY_TEMPLATE }
            - name: savegames
              persistentVolumeClaim: { claimName: PLACEHOLDER_REPLACED_BY_TEMPLATE }

palworld:
  image:
    repository: ghcr.io/pocketpairjp/palserver
    # tag format: "vX.Y.Z" (or "vX.Y.Z@sha256:<digest>" to pin).
    tag: ""
    pullPolicy: IfNotPresent
  restPort: 8212
  gamePort: 8211
  env: { }
  envFrom: [ ]

sidecar:
  image:
    repository: ghcr.io/m00nwtchr/agones-palworld
    # tag format: "X.Y.Z" (or "X.Y.Z@sha256:<digest>" to pin); defaults to chart AppVersion when empty.
    tag: ""
    pullPolicy: IfNotPresent
  pollIntervalSeconds: 5
  healthIntervalSeconds: 2
  shutdown:
    saveTimeoutSeconds: 30
    waittimeSeconds: 30
    announceMessage: "Server shutting down"
  env: { }
  envFrom: [ ]

otel:
  enabled: true
  endpoint: ""
  protocol: "grpc"
  serviceName: "agones-palworld"
  serviceNamespace: "palworld"
  serviceVersion: ""

metrics:
  service:
    enabled: true
    type: ClusterIP
    port: 9090
    annotations: { }
    labels: { }
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
    scheme: HTTP
    labels: { }
    namespaceSelector: ""
    honorLabels: false

pvc:
  enabled: true
  existingClaim: ""
  size: 50Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]
  mountPath: /pal/Package/Pal/Saved

pod:
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

containerSecurityContext:
  allowPrivilegeEscalation: false
  # readOnlyRootFilesystem is OFF by default: the Palworld game server
  # expects a writable root (config / cache writes outside mounted volumes).
  # Operators who want it back on the sidecar container (or all containers)
  # can override this block in their values.
  readOnlyRootFilesystem: false
  capabilities: { drop: ["ALL"] }

service:
  type: ClusterIP
  port: 8211
  protocol: UDP
  ipFamilyPolicy: SingleStack
  ipFamilies: [IPv4]
  annotations: { }
  labels: { }

secret:
  enabled: true
  existingSecret: ""
  passwordKey: "PALWORLD_ADMIN_PASSWORD"
  autoGenerate: true
  length: 32
